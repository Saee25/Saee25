name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Saee25
          outputs: |
            dist/github-snake.svg?color_snake=%234B5563&color_dots=%23ebedf0,%23fce7f3,%23fbcfe8,%23f472b6,%23db2777
            dist/github-snake-dark.svg?color_snake=%239CA3AF&color_dots=%23161b22,%23631634,%23831843,%239d174d,%23be185d

      - name: Publish generated snake
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
