<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft light grey background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDFBFD"/>
      <stop offset="0.5" stop-color="#F4F4F6"/>
      <stop offset="1" stop-color="#F8F8FA"/>
    </linearGradient>

    <!-- Aurora Pink -->
    <radialGradient id="pink-aurora" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(350 110) rotate(25) scale(420 190)">
      <stop stop-color="#F472B6" stop-opacity="0.25"/>
      <stop offset="0.45" stop-color="#FB7185" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FB7185" stop-opacity="0"/>
    </radialGradient>

    <!-- Aurora Grey -->
    <radialGradient id="grey-aurora" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(900 300) rotate(-20) scale(430 180)">
      <stop stop-color="#94A3B8" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#64748B" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#64748B" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft central glow -->
    <radialGradient id="glow" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(610 200) scale(330 110)">
      <stop stop-color="#FB7185" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FB7185" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="38"/>
    </filter>

    <filter id="noise">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.8"
        numOctaves="3"
        stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.035"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>

  <!-- Aurora fields (Animation slowed down x2) -->
  <ellipse
    cx="350"
    cy="110"
    rx="420"
    ry="190"
    fill="url(#pink-aurora)"
    filter="url(#blur)">
    <animate
      attributeName="cx"
      values="350;430;350"
      dur="28s"
      repeatCount="indefinite"/>
    <animate
      attributeName="cy"
      values="110;145;110"
      dur="34s"
      repeatCount="indefinite"/>
  </ellipse>

  <ellipse
    cx="900"
    cy="300"
    rx="430"
    ry="180"
    fill="url(#grey-aurora)"
    filter="url(#blur)">
    <animate
      attributeName="cx"
      values="900;820;900"
      dur="32s"
      repeatCount="indefinite"/>
    <animate
      attributeName="cy"
      values="300;270;300"
      dur="38s"
      repeatCount="indefinite"/>
  </ellipse>

  <ellipse
    cx="610"
    cy="200"
    rx="330"
    ry="110"
    fill="url(#glow)"
    filter="url(#blur)"/>

  <!-- Small stars -->
  <g fill="#9CA3AF">
    <circle cx="92" cy="74" r="1.2" opacity="0.45"/>
    <circle cx="180" cy="315" r="1" opacity="0.35"/>
    <circle cx="280" cy="58" r="1.3" opacity="0.40"/>
    <circle cx="470" cy="86" r="0.9" opacity="0.35"/>
    <circle cx="690" cy="62" r="1" opacity="0.35"/>
    <circle cx="820" cy="115" r="1.2" opacity="0.38"/>
    <circle cx="1050" cy="78" r="0.9" opacity="0.32"/>
    <circle cx="1120" cy="280" r="1.2" opacity="0.38"/>
    <circle cx="1010" cy="360" r="0.9" opacity="0.30"/>
    <circle cx="760" cy="350" r="1.1" opacity="0.28"/>
    <circle cx="520" cy="350" r="0.8" opacity="0.32"/>
    <circle cx="120" cy="220" r="0.8" opacity="0.28"/>
  </g>

  <!-- Constellations -->
  <g stroke="#9CA3AF" stroke-width="0.7" opacity="0.25">
    <path d="M180 120 L250 165 L315 125 L370 180"/>
    <path d="M820 245 L875 205 L940 235 L1000 185"/>
  </g>

  <g fill="#9CA3AF" opacity="0.38">
    <circle cx="180" cy="120" r="2"/>
    <circle cx="250" cy="165" r="1.5"/>
    <circle cx="315" cy="125" r="1.8"/>
    <circle cx="370" cy="180" r="1.4"/>
    <circle cx="820" cy="245" r="1.6"/>
    <circle cx="875" cy="205" r="2"/>
    <circle cx="940" cy="235" r="1.4"/>
    <circle cx="1000" cy="185" r="1.7"/>
  </g>

  <!-- Name -->
  <text
    x="600"
    y="185"
    text-anchor="middle"
    fill="#1F2937"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="54"
    font-weight="600"
    letter-spacing="3">
    Saee Nalawade
  </text>

  <!-- Divider -->
  <line
    x1="520"
    y1="215"
    x2="680"
    y2="215"
    stroke="#F472B6"
    stroke-width="1"
    opacity="0.45"/>

  <!-- Subtitle -->
  <text
    x="600"
    y="252"
    text-anchor="middle"
    fill="#6B7280"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="15"
    letter-spacing="4"
    opacity="0.85">
    MY LITTLE CORNER OF THE INTERNET
  </text>

  <!-- Decorative mark -->
  <text
    x="600"
    y="335"
    text-anchor="middle"
    fill="#FB7185"
    font-family="Georgia, serif"
    font-size="18"
    opacity="0.75">
    ✦
  </text>

  <!-- Grain -->
  <rect
    width="1200"
    height="420"
    rx="24"
    filter="url(#noise)"
    opacity="0.8"/>
</svg>
