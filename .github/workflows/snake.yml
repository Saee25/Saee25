name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Saee25
          outputs: |
            dist/github-snake.svg?color_snake=%23d63375&color_dots=%23ebedf0,%23ffd8e6,%23ffb3d1,%23ff80b3,%23e64d8a
            dist/github-snake-dark.svg?color_snake=%23ff80b3&color_dots=%23161b22,%234d132a,%23801a40,%23b32d59,%23e64d8a

      - name: Publish generated snake
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
