<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <!-- Deep background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08080D"/>
      <stop offset="0.5" stop-color="#0D0B18"/>
      <stop offset="1" stop-color="#070A12"/>
    </linearGradient>

    <!-- Aurora violet -->
    <radialGradient id="violet" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(350 110) rotate(25) scale(420 190)">
      <stop stop-color="#8B5CF6" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#6D5DFC" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6D5DFC" stop-opacity="0"/>
    </radialGradient>

    <!-- Aurora blue -->
    <radialGradient id="blue" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(900 300) rotate(-20) scale(430 180)">
      <stop stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#2563EB" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft central glow -->
    <radialGradient id="glow" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(610 200) scale(330 110)">
      <stop stop-color="#A78BFA" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>

    <!-- Fine grain -->
    <filter id="noise">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.8"
        numOctaves="3"
        stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.045"/>
      </feComponentTransfer>
    </filter>

    <!-- Aurora blur -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="38"/>
    </filter>

  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>

  <!-- Aurora fields -->
  <ellipse
    cx="350"
    cy="110"
    rx="420"
    ry="190"
    fill="url(#violet)"
    filter="url(#blur)">
    <animate
      attributeName="cx"
      values="350;430;350"
      dur="14s"
      repeatCount="indefinite"/>
    <animate
      attributeName="cy"
      values="110;145;110"
      dur="17s"
      repeatCount="indefinite"/>
  </ellipse>

  <ellipse
    cx="900"
    cy="300"
    rx="430"
    ry="180"
    fill="url(#blue)"
    filter="url(#blur)">
    <animate
      attributeName="cx"
      values="900;820;900"
      dur="16s"
      repeatCount="indefinite"/>
    <animate
      attributeName="cy"
      values="300;270;300"
      dur="19s"
      repeatCount="indefinite"/>
  </ellipse>

  <ellipse
    cx="610"
    cy="200"
    rx="330"
    ry="110"
    fill="url(#glow)"
    filter="url(#blur)"/>

  <!-- Tiny stars -->
  <g fill="#E9D5FF">
    <circle cx="92" cy="74" r="1.2" opacity="0.55"/>
    <circle cx="180" cy="315" r="1" opacity="0.35"/>
    <circle cx="280" cy="58" r="1.3" opacity="0.6"/>
    <circle cx="470" cy="86" r="0.9" opacity="0.4"/>
    <circle cx="690" cy="62" r="1" opacity="0.45"/>
    <circle cx="820" cy="115" r="1.2" opacity="0.5"/>
    <circle cx="1050" cy="78" r="0.9" opacity="0.35"/>
    <circle cx="1120" cy="280" r="1.2" opacity="0.5"/>
    <circle cx="1010" cy="360" r="0.9" opacity="0.4"/>
    <circle cx="760" cy="350" r="1.1" opacity="0.3"/>
    <circle cx="520" cy="350" r="0.8" opacity="0.35"/>
    <circle cx="120" cy="220" r="0.8" opacity="0.3"/>
  </g>

  <!-- Decorative constellation -->
  <g stroke="#A78BFA" stroke-width="0.7" opacity="0.22">
    <path d="M180 120 L250 165 L315 125 L370 180"/>
    <path d="M820 245 L875 205 L940 235 L1000 185"/>
  </g>

  <g fill="#C4B5FD" opacity="0.5">
    <circle cx="180" cy="120" r="2"/>
    <circle cx="250" cy="165" r="1.5"/>
    <circle cx="315" cy="125" r="1.8"/>
    <circle cx="370" cy="180" r="1.4"/>
    <circle cx="820" cy="245" r="1.6"/>
    <circle cx="875" cy="205" r="2"/>
    <circle cx="940" cy="235" r="1.4"/>
    <circle cx="1000" cy="185" r="1.7"/>
  </g>

  <!-- Main typography -->
  <text
    x="600"
    y="185"
    text-anchor="middle"
    fill="#F8F7FF"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="54"
    font-weight="600"
    letter-spacing="3">
    Saee Nalawade
  </text>

  <!-- Small line -->
  <line
    x1="520"
    y1="215"
    x2="680"
    y2="215"
    stroke="#A78BFA"
    stroke-width="1"
    opacity="0.45"/>

  <!-- Small subtitle -->
  <text
    x="600"
    y="252"
    text-anchor="middle"
    fill="#C4C1D4"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="15"
    letter-spacing="4"
    opacity="0.75">
    MY LITTLE CORNER OF THE INTERNET
  </text>

  <!-- Bottom decorative mark -->
  <text
    x="600"
    y="335"
    text-anchor="middle"
    fill="#A78BFA"
    font-family="Georgia, serif"
    font-size="18"
    opacity="0.65">
    ✦
  </text>

  <!-- Grain overlay -->
  <rect
    width="1200"
    height="420"
    rx="24"
    filter="url(#noise)"
    opacity="0.8"/>
</svg>
